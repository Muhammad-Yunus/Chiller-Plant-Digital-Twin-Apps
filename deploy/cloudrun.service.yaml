# Declarative Cloud Run Service Manifest (Knative v1) — Supabase PostgreSQL Backend
# Replace PROJECT_ID and IMAGE_TAG before applying:
#   gcloud run services replace deploy/cloudrun.service.yaml --region=asia-southeast1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chiller-plant-twin
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Pilot boundary: single instance required while PlantRealtimeBus SSE uses in-memory EventEmitter.
        # Remove maxScale="1" only after backing PlantRealtimeBus with Supabase Realtime / Postgres LISTEN-NOTIFY / Redis Pub-Sub.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: chiller-plant-twin-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/PROJECT_ID/chiller-plant-twin/app:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: APP_URL
              value: https://chiller-plant-twin.example.com
            - name: SQL_SSL
              value: "true"
            - name: SQL_SSL_REJECT_UNAUTHORIZED
              value: "true"
            - name: SQL_POOL_MAX
              value: "10"
            - name: TELEMETRY_STALE_AFTER_SEC
              value: "15"
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: chiller-supabase-db-url
                  key: latest
            - name: SQL_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: chiller-supabase-root-ca
                  key: latest
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: chiller-bootstrap-admin-email
                  key: latest
          startupProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
