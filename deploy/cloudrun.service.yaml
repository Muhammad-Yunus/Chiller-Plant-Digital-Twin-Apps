# Declarative Cloud Run Service Manifest (Knative v1)
# Replace PROJECT_ID, REGION, INSTANCE_NAME, and IMAGE_TAG before applying:
#   gcloud run services replace deploy/cloudrun.service.yaml --region=asia-southeast1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chiller-plant-twin
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Single instance required while PlantRealtimeBus SSE uses in-memory EventEmitter
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:asia-southeast1:INSTANCE_NAME
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: chiller-plant-twin-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/PROJECT_ID/chiller-plant-twin/app:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: APP_URL
              value: https://chiller-plant-twin.example.com
            - name: SQL_HOST
              value: /cloudsql/PROJECT_ID:asia-southeast1:INSTANCE_NAME
            - name: SQL_DB_NAME
              value: chiller_plant_twin
            - name: SQL_USER
              value: app_user
            - name: SQL_SSL
              value: "false"
            - name: TELEMETRY_STALE_AFTER_SEC
              value: "15"
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chiller-sql-app-password
                  key: latest
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: chiller-bootstrap-admin-email
                  key: latest
          startupProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
