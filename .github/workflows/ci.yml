name: CI — Lint, Test, Build & Migration Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: chiller_plant_twin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: TypeScript type-check
        run: bun run lint

      - name: Drizzle migration & schema check
        env:
          SQL_HOST: 127.0.0.1
          SQL_PORT: 5432
          SQL_DB_NAME: chiller_plant_twin_ci
          SQL_ADMIN_USER: postgres
          SQL_ADMIN_PASSWORD: ci_postgres_password
          SQL_SSL: "false"
        run: |
          bunx drizzle-kit check --config=src/db/drizzle.config.ts
          bun run db:migrate

      - name: Unit, API & PostgreSQL transaction tests
        env:
          SQL_HOST: 127.0.0.1
          SQL_PORT: 5432
          SQL_DB_NAME: chiller_plant_twin_ci
          SQL_USER: postgres
          SQL_PASSWORD: ci_postgres_password
          SQL_SSL: "false"
        run: bun run test

      - name: Production frontend build & Node 22 startup smoke check
        env:
          NODE_ENV: production
          PORT: 3000
          SQL_HOST: 127.0.0.1
          SQL_PORT: 5432
          SQL_DB_NAME: chiller_plant_twin_ci
          SQL_USER: postgres
          SQL_PASSWORD: ci_postgres_password
          SQL_SSL: "false"
        run: |
          bun run build
          node server.ts &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if wget -qO- http://127.0.0.1:3000/api/health; then
              kill $SERVER_PID
              wait $SERVER_PID || true
              exit 0
            fi
            sleep 1
          done
          kill $SERVER_PID || true
          exit 1
