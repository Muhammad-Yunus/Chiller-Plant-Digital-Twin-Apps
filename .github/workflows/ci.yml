name: CI — Lint, Test, Build & Migration Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: chiller_plant_twin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type-check
        run: npm run lint

      - name: Drizzle migration & schema check
        env:
          SQL_HOST: 127.0.0.1
          SQL_PORT: 5432
          SQL_DB_NAME: chiller_plant_twin_ci
          SQL_ADMIN_USER: postgres
          SQL_ADMIN_PASSWORD: ci_postgres_password
          SQL_SSL: "false"
        run: |
          npx drizzle-kit check --config=src/db/drizzle.config.ts
          npm run db:migrate

      - name: Unit, API & PostgreSQL transaction tests
        env:
          SQL_HOST: 127.0.0.1
          SQL_PORT: 5432
          SQL_DB_NAME: chiller_plant_twin_ci
          SQL_USER: postgres
          SQL_PASSWORD: ci_postgres_password
          SQL_SSL: "false"
        run: npm test

      - name: Production frontend build
        run: npm run build
